<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabla periódica · Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#EEF1EC;--card:#F8F9F5;--ink:#1B2430;--muted:#5C6878;--line:#D3D9D0;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#131A22;--card:#1B2530;--ink:#E8ECE6;--muted:#9AA6B2;--line:#2C3947;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#131A22;--card:#1B2530;--ink:#E8ECE6;--muted:#9AA6B2;--line:#2C3947;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{max-width:1200px;margin:0 auto;padding:28px 20px 8px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(1.8rem,4vw,2.6rem);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px}
.tabs button,.chip,.mode,.btn{font:inherit;cursor:pointer;border:1px solid transparent;background:none;color:var(--ink);border-radius:999px;padding:7px 14px}
.tabs button[aria-selected="true"],.mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
main{max-width:1200px;margin:0 auto;padding:12px 20px 48px}
button:focus-visible,input:focus-visible{outline:3px solid #4A7BD0;outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0 16px}
input[type=search],input[type=text]{font:inherit;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;border-color:var(--line);padding:5px 11px}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.sw{width:11px;height:11px;border-radius:3px;background:var(--c)}
.scroll{overflow-x:auto;padding-bottom:6px}
.table{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));gap:3px;min-width:760px;position:relative}
.cell{background:var(--c);color:#14191F;border:0;border-radius:5px;padding:4px 3px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;cursor:pointer;min-width:0;aspect-ratio:1/1.05;transition:opacity .2s}
.cell .z{font-size:.62rem;align-self:flex-start;opacity:.7}
.cell .s{font-family:Fraunces,Georgia,serif;font-size:clamp(.85rem,1.8vw,1.3rem);font-weight:600;line-height:1}
.cell .n{font-size:.52rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.dim{opacity:.15}
.cell.sel{outline:2px solid var(--ink);outline-offset:2px}
.lbl{font-size:.7rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.detail{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:20px 28px;align-items:center}
.big{width:150px;height:150px;border-radius:14px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#14191F}
.big .s{font-family:Fraunces,Georgia,serif;font-size:4.2rem;font-weight:600;line-height:1}
.big .z{font-size:.9rem}
.detail h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.7rem;margin:0 0 8px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
dt{color:var(--muted)}
dd{margin:0;font-weight:500}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.quiz{max-width:560px;margin:0 auto}
.modes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.mode{border-color:var(--line);background:var(--card)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:34px 24px;text-align:center}
.prompt{font-family:Fraunces,Georgia,serif;font-size:clamp(3rem,10vw,5rem);font-weight:600;line-height:1.05;margin:4px 0 6px;word-break:break-word}
.hint{color:var(--muted);margin:0 0 20px}
.answer{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.answer input{width:min(260px,70%);font-size:1.05rem}
.btn{background:var(--ink);color:var(--paper);font-weight:600;padding:9px 18px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.feedback{min-height:52px;margin-top:18px;font-size:1.02rem}
.ok{color:#2F7D57;font-weight:600}
.bad{color:#B5483A;font-weight:600}
.score{display:flex;justify-content:center;gap:28px;margin-top:18px;color:var(--muted)}
.score b{color:var(--ink);font-size:1.2rem;display:block;text-align:center}
[hidden]{display:none!important}
@media (max-width:640px){.detail{grid-template-columns:1fr;justify-items:center;text-align:center}dl{text-align:left}}
@media (prefers-reduced-motion:reduce){.cell{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Tabla periódica</h1>
    <p class="sub">Explora los 118 elementos o pon a prueba lo que sabes.</p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-ex" aria-selected="true" aria-controls="explorar">Explorar</button>
    <button role="tab" id="t-qz" aria-selected="false" aria-controls="quiz">Quiz</button>
  </div>
</header>

<main>
<section id="explorar" role="tabpanel" aria-labelledby="t-ex">
  <div class="toolbar">
    <input type="search" id="q" placeholder="Buscar por nombre, símbolo o número" aria-label="Buscar elemento">
  </div>
  <div class="legend" id="legend"></div>
  <div class="scroll">
    <div class="table" id="grid" role="grid" aria-label="Tabla periódica"></div>
  </div>
  <div class="detail" id="detail" hidden></div>
</section>

<section id="quiz" role="tabpanel" aria-labelledby="t-qz" hidden>
  <div class="quiz">
    <div class="modes">
      <button class="mode" data-mode="sn" aria-pressed="true">Símbolo → nombre</button>
      <button class="mode" data-mode="ns" aria-pressed="false">Nombre → símbolo</button>
      <button class="mode" data-mode="zs" aria-pressed="false">Número → símbolo</button>
    </div>
    <div class="qcard">
      <div class="hint" id="qhint"></div>
      <div class="prompt" id="qprompt"></div>
      <div class="answer">
        <input type="text" id="ans" autocomplete="off" aria-label="Tu respuesta">
        <button class="btn" id="check">Comprobar</button>
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="answer" id="nextRow" hidden><button class="btn ghost" id="next">Siguiente elemento</button></div>
    </div>
    <div class="score">
      <div><b id="sc">0</b>aciertos</div>
      <div><b id="tot">0</b>intentos</div>
      <div><b id="rach">0</b>racha</div>
    </div>
  </div>
</section>
</main>

<script>
const CATS = {
  a:["Metales alcalinos","#E07A5F"], t:["Alcalinotérreos","#F2A65A"],
  m:["Metales de transición","#6A9BD1"], p:["Otros metales","#9DB4C4"],
  s:["Metaloides","#7BB59A"], n:["No metales","#A9CF8C"],
  h:["Halógenos","#E9C46A"], g:["Gases nobles","#B797D6"],
  l:["Lantánidos","#E88DB0"], c:["Actínidos","#5FB3B3"]
};
// [símbolo, nombre, masa, fila, columna, categoría]; el número atómico es la posición + 1
const E = [
["H","Hidrógeno",1.008,1,1,"n"],["He","Helio",4.0026,1,18,"g"],
["Li","Litio",6.94,2,1,"a"],["Be","Berilio",9.0122,2,2,"t"],["B","Boro",10.81,2,13,"s"],["C","Carbono",12.011,2,14,"n"],["N","Nitrógeno",14.007,2,15,"n"],["O","Oxígeno",15.999,2,16,"n"],["F","Flúor",18.998,2,17,"h"],["Ne","Neón",20.180,2,18,"g"],
["Na","Sodio",22.990,3,1,"a"],["Mg","Magnesio",24.305,3,2,"t"],["Al","Aluminio",26.982,3,13,"p"],["Si","Silicio",28.085,3,14,"s"],["P","Fósforo",30.974,3,15,"n"],["S","Azufre",32.06,3,16,"n"],["Cl","Cloro",35.45,3,17,"h"],["Ar","Argón",39.948,3,18,"g"],
["K","Potasio",39.098,4,1,"a"],["Ca","Calcio",40.078,4,2,"t"],["Sc","Escandio",44.956,4,3,"m"],["Ti","Titanio",47.867,4,4,"m"],["V","Vanadio",50.942,4,5,"m"],["Cr","Cromo",51.996,4,6,"m"],["Mn","Manganeso",54.938,4,7,"m"],["Fe","Hierro",55.845,4,8,"m"],["Co","Cobalto",58.933,4,9,"m"],["Ni","Níquel",58.693,4,10,"m"],["Cu","Cobre",63.546,4,11,"m"],["Zn","Zinc",65.38,4,12,"m"],["Ga","Galio",69.723,4,13,"p"],["Ge","Germanio",72.630,4,14,"s"],["As","Arsénico",74.922,4,15,"s"],["Se","Selenio",78.971,4,16,"n"],["Br","Bromo",79.904,4,17,"h"],["Kr","Criptón",83.798,4,18,"g"],
["Rb","Rubidio",85.468,5,1,"a"],["Sr","Estroncio",87.62,5,2,"t"],["Y","Itrio",88.906,5,3,"m"],["Zr","Circonio",91.224,5,4,"m"],["Nb","Niobio",92.906,5,5,"m"],["Mo","Molibdeno",95.95,5,6,"m"],["Tc","Tecnecio",98,5,7,"m"],["Ru","Rutenio",101.07,5,8,"m"],["Rh","Rodio",102.91,5,9,"m"],["Pd","Paladio",106.42,5,10,"m"],["Ag","Plata",107.87,5,11,"m"],["Cd","Cadmio",112.41,5,12,"m"],["In","Indio",114.82,5,13,"p"],["Sn","Estaño",118.71,5,14,"p"],["Sb","Antimonio",121.76,5,15,"s"],["Te","Teluro",127.60,5,16,"s"],["I","Yodo",126.90,5,17,"h"],["Xe","Xenón",131.29,5,18,"g"],
["Cs","Cesio",132.91,6,1,"a"],["Ba","Bario",137.33,6,2,"t"],["La","Lantano",138.91,6,3,"l"],
["Ce","Cerio",140.12,9,4,"l"],["Pr","Praseodimio",140.91,9,5,"l"],["Nd","Neodimio",144.24,9,6,"l"],["Pm","Prometio",145,9,7,"l"],["Sm","Samario",150.36,9,8,"l"],["Eu","Europio",151.96,9,9,"l"],["Gd","Gadolinio",157.25,9,10,"l"],["Tb","Terbio",158.93,9,11,"l"],["Dy","Disprosio",162.50,9,12,"l"],["Ho","Holmio",164.93,9,13,"l"],["Er","Erbio",167.26,9,14,"l"],["Tm","Tulio",168.93,9,15,"l"],["Yb","Iterbio",173.05,9,16,"l"],["Lu","Lutecio",174.97,9,17,"l"],
["Hf","Hafnio",178.49,6,4,"m"],["Ta","Tantalio",180.95,6,5,"m"],["W","Wolframio",183.84,6,6,"m"],["Re","Renio",186.21,6,7,"m"],["Os","Osmio",190.23,6,8,"m"],["Ir","Iridio",192.22,6,9,"m"],["Pt","Platino",195.08,6,10,"m"],["Au","Oro",196.97,6,11,"m"],["Hg","Mercurio",200.59,6,12,"m"],["Tl","Talio",204.38,6,13,"p"],["Pb","Plomo",207.2,6,14,"p"],["Bi","Bismuto",208.98,6,15,"p"],["Po","Polonio",209,6,16,"p"],["At","Astato",210,6,17,"h"],["Rn","Radón",222,6,18,"g"],
["Fr","Francio",223,7,1,"a"],["Ra","Radio",226,7,2,"t"],["Ac","Actinio",227,7,3,"c"],
["Th","Torio",232.04,10,4,"c"],["Pa","Protactinio",231.04,10,5,"c"],["U","Uranio",238.03,10,6,"c"],["Np","Neptunio",237,10,7,"c"],["Pu","Plutonio",244,10,8,"c"],["Am","Americio",243,10,9,"c"],["Cm","Curio",247,10,10,"c"],["Bk","Berkelio",247,10,11,"c"],["Cf","Californio",251,10,12,"c"],["Es","Einstenio",252,10,13,"c"],["Fm","Fermio",257,10,14,"c"],["Md","Mendelevio",258,10,15,"c"],["No","Nobelio",259,10,16,"c"],["Lr","Laurencio",266,10,17,"c"],
["Rf","Rutherfordio",267,7,4,"m"],["Db","Dubnio",268,7,5,"m"],["Sg","Seaborgio",269,7,6,"m"],["Bh","Bohrio",270,7,7,"m"],["Hs","Hassio",277,7,8,"m"],["Mt","Meitnerio",278,7,9,"m"],["Ds","Darmstadtio",281,7,10,"m"],["Rg","Roentgenio",282,7,11,"m"],["Cn","Copernicio",285,7,12,"m"],["Nh","Nihonio",286,7,13,"p"],["Fl","Flerovio",289,7,14,"p"],["Mc","Moscovio",290,7,15,"p"],["Lv","Livermorio",293,7,16,"p"],["Ts","Teneso",294,7,17,"h"],["Og","Oganesón",294,7,18,"g"]
];

const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const $ = id => document.getElementById(id);
let activeCat = null;
let selected = -1;

// Leyenda
const legend = $("legend");
Object.entries(CATS).forEach(([k,[name,c]]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.setAttribute("aria-pressed","false");
  b.style.setProperty("--c", c);
  b.innerHTML = '<span class="sw"></span>';
  b.append(name);
  b.onclick = () => {
    activeCat = activeCat === k ? null : k;
    legend.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
    if (activeCat) b.setAttribute("aria-pressed","true");
    applyFilter();
  };
  legend.appendChild(b);
});

// Tabla
const grid = $("grid");
const cells = [];
E.forEach(([s,n,m,r,c,k], i) => {
  const b = document.createElement("button");
  b.className = "cell";
  b.style.setProperty("--c", CATS[k][1]);
  b.style.gridRow = r; b.style.gridColumn = c;
  b.setAttribute("aria-label", `${n}, símbolo ${s}, número ${i+1}`);
  b.innerHTML = `<span class="z">${i+1}</span><span class="s">${s}</span><span class="n">${n}</span>`;
  b.onclick = () => select(i);
  grid.appendChild(b);
  cells.push(b);
});
[[9,"57–71"],[10,"89–103"]].forEach(([r,t]) => {
  const d = document.createElement("div");
  d.className = "lbl"; d.style.gridRow = r; d.style.gridColumn = 3; d.textContent = t;
  grid.appendChild(d);
});

// Búsqueda y filtros
$("q").addEventListener("input", applyFilter);
function applyFilter(){
  const q = norm($("q").value);
  E.forEach(([s,n,m,r,c,k], i) => {
    const okCat = !activeCat || k === activeCat;
    const okQ = !q || norm(n).includes(q) || s.toLowerCase() === q || String(i+1) === q;
    cells[i].classList.toggle("dim", !(okCat && okQ));
  });
}

// Detalle
function select(i){
  selected = i;
  cells.forEach((b,j) => b.classList.toggle("sel", j === i));
  const [s,n,m,r,c,k] = E[i];
  const f = r >= 9;
  const grupo = f ? (r === 9 ? "Serie de lantánidos" : "Serie de actínidos") : (c > 2 && c < 13 && r > 3 || r === 6 && c === 3 ? "" : "");
  const det = $("detail");
  det.hidden = false;
  det.innerHTML = "";
  const big = document.createElement("div");
  big.className = "big"; big.style.setProperty("--c", CATS[k][1]);
  big.innerHTML = `<span class="z">${i+1}</span><span class="s">${s}</span>`;
  const info = document.createElement("div");
  const h = document.createElement("h2"); h.textContent = n;
  const dl = document.createElement("dl");
  const rows = [
    ["Número atómico", i+1],
    ["Masa atómica", m + " u"],
    ["Periodo (fila)", f ? "Fuera de la tabla principal" : r],
    ["Grupo (columna)", f ? "Serie f" : c],
    ["Categoría", CATS[k][0]],
    ["Electrones de valencia", f ? "—" : "—"]
  ];
  rows.forEach(([a,b]) => {
    const dt = document.createElement("dt"); dt.textContent = a;
    const dd = document.createElement("dd"); dd.textContent = b;
    dl.append(dt, dd);
  });
  info.append(h, dl);
  det.append(big, info);
  det.scrollIntoView({behavior:"smooth", block:"nearest"});
}

// Quiz
let mode = "sn", cur = null, score = 0, total = 0, streak = 0, answered = false;
const HINTS = {
  sn:["Dado el símbolo, escribe el nombre del elemento.","Símbolo"],
  ns:["Dado el nombre, escribe el símbolo.","Nombre"],
  zs:["Dado el número atómico, escribe el símbolo.","Número atómico"]
};
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  newQ();
});
function newQ(){
  const i = Math.floor(Math.random()*E.length);
  cur = { i, el: E[i] };
  answered = false;
  const [s,n] = cur.el;
  let prompt;
  if (mode === "sn") prompt = s;
  else if (mode === "ns") prompt = n;
  else prompt = String(i+1);
  $("qhint").textContent = HINTS[mode][0];
  $("qprompt").textContent = prompt;
  $("ans").value = "";
  $("ans").disabled = false;
  $("check").disabled = false;
  $("fb").textContent = "";
  $("fb").className = "feedback";
  $("nextRow").hidden = true;
  $("ans").focus();
}
function check(){
  if (answered || !cur) return;
  const val = $("ans").value;
  if (!val.trim()) return;
  const [s,n] = cur.el;
  const ok = mode === "sn" ? norm(val) === norm(n) : val.trim().toLowerCase() === s.toLowerCase();
  answered = true;
  total++;
  if (ok){ score++; streak++; }
  else streak = 0;
  const correct = mode === "sn" ? n : s;
  $("fb").className = "feedback " + (ok ? "ok" : "bad");
  $("fb").textContent = ok ? "¡Correcto!" : `No es exactamente. La respuesta es: ${correct}`;
  $("ans").disabled = true;
  $("check").disabled = true;
  $("sc").textContent = score; $("tot").textContent = total; $("rach").textContent = streak;
  $("nextRow").hidden = false;
  $("next").focus();
}
$("check").onclick = check;
$("next").onclick = newQ;
$("ans").addEventListener("keydown", e => { if (e.key === "Enter") check(); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && answered && document.activeElement === $("next")) newQ();
});

// Pestañas
function showTab(id){
  const ex = id === "explorar";
  $("explorar").hidden = !ex; $("quiz").hidden = ex;
  $("t-ex").setAttribute("aria-selected", ex);
  $("t-qz").setAttribute("aria-selected", !ex);
  if (!ex) newQ();
}
$("t-ex").onclick = () => showTab("explorar");
$("t-qz").onclick = () => showTab("quiz");
</script>
</body>
</html>
